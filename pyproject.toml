[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "resonance-journal"
version = "0.1.0"
description = "A small local-first journal: create, edit, tag, link, search, view, archive, export."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
rj = "resonance_journal.cli:main"

[tool.setuptools]
packages = ["resonance_journal"]
