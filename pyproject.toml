[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "resonance-journal"
version = "0.1.0"
description = "A small local-first journal: create, edit, tag, link, search, view, archive, export."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = {text = "AGPL-3.0-only OR LicenseRef-Commercial"}
authors = [{name = "Samuel Jackson Grim", email = "samgrim97@gmail.com"}]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
rj = "resonance_journal.cli:main"

[tool.setuptools]
packages = ["resonance_journal"]
